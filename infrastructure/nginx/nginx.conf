
events {}

http {
    # Docker's embedded DNS. Without this, nginx resolves the gateway once at
    # startup and keeps proxying to a stale IP after the container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        location / {
            set $api_gateway http://api-gateway:3000;
            proxy_pass $api_gateway;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
