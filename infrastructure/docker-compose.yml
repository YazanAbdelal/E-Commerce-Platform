services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - ecommerce
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - ecommerce
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    container_name: ecommerce-loki
    command:
      - "-config.file=/etc/loki/config.yaml"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - ecommerce
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: ecommerce-alloy
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - ecommerce
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: ecommerce-tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - ecommerce
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ecommerce
    restart: unless-stopped

  api-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    expose:
      - "3000"
    environment:
      PORT: 3000
      PRODUCT_CATALOG_URL: http://product-catalog-service:3001
      USER_SERVICE_URL: http://user-service:3002
      CART_SERVICE_URL: http://shopping-cart-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

      OTEL_SERVICE_NAME: api-gateway
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_PROPAGATORS: tracecontext,baggage
      NODE_OPTIONS: >-
        --experimental-loader=@opentelemetry/instrumentation/hook.mjs
        --import=@opentelemetry/auto-instrumentations-node/register
    depends_on:
      - product-catalog-service
      - user-service
      - shopping-cart-service
      - order-service
      - payment-service
    networks:
      - ecommerce
    restart: unless-stopped

  product-catalog-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: product-catalog-service
    expose:
      - "3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://ecommerce:ecommerce_dev@postgres:5432/product_catalog?schema=public
      REDIS_URL: redis://redis:6379

      OTEL_SERVICE_NAME: product-catalog-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_PROPAGATORS: tracecontext,baggage
      NODE_OPTIONS: >-
        --experimental-loader=@opentelemetry/instrumentation/hook.mjs
        --import=@opentelemetry/auto-instrumentations-node/register
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce
    restart: unless-stopped

  user-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: user-service
    expose:
      - "3002"
    environment:
      PORT: 3002
      USER_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@postgres:5432/user_service?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce
    restart: unless-stopped

  shopping-cart-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: shopping-cart-service
    expose:
      - "3003"
    environment:
      PORT: 3003
      CART_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@postgres:5432/shopping_cart?schema=public
      PRODUCT_CATALOG_URL: http://product-catalog-service:3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

      OTEL_SERVICE_NAME: shopping-cart-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_PROPAGATORS: tracecontext,baggage
      NODE_OPTIONS: >-
        --experimental-loader=@opentelemetry/instrumentation/hook.mjs
        --import=@opentelemetry/auto-instrumentations-node/register
    depends_on:
      postgres:
        condition: service_healthy
      product-catalog-service:
        condition: service_started
    networks:
      - ecommerce
    restart: unless-stopped

  order-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: order-service
    expose:
      - "3004"
    environment:
      PORT: 3004
      ORDER_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@postgres:5432/order_service?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

      SHOPPING_CART_URL: http://shopping-cart-service:3003
      PRODUCT_CATALOG_URL: http://product-catalog-service:3001

      OTEL_SERVICE_NAME: order-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_PROPAGATORS: tracecontext,baggage
      NODE_OPTIONS: >-
        --experimental-loader=@opentelemetry/instrumentation/hook.mjs
        --import=@opentelemetry/auto-instrumentations-node/register
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce
    restart: unless-stopped

  payment-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APP_NAME: payment-service
    expose:
      - "3005"
    environment:
      PORT: 3005
      PAYMENT_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@postgres:5432/payment_service?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

      ORDER_SERVICE_URL: http://order-service:3004

      OTEL_SERVICE_NAME: payment-service
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_PROPAGATORS: tracecontext,baggage
      NODE_OPTIONS: >-
        --experimental-loader=@opentelemetry/instrumentation/hook.mjs
        --import=@opentelemetry/auto-instrumentations-node/register
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_started
    networks:
      - ecommerce
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: e-commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_dev
      POSTGRES_DB: product_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d product_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce

  redis:
    image: redis:7-alpine
    container_name: e-commerce-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:

networks:
  ecommerce:
    driver: bridge
