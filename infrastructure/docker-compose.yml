services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - ecommerce

  api-gateway:
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    expose:
      - "3000"
    environment:
      - PRODUCT_SERVICE_URL=http://product-catalog-service:3001
    depends_on:
      - product-catalog-service
    networks:
      - ecommerce

  product-catalog-service:
    build:
      context: ..
      dockerfile: apps/product-catalog-service/Dockerfile
    expose:
      - "3001"
    networks:
      - ecommerce

  postgres:
    image: postgres:17
    container_name: e-commerce-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ecommerce
      - POSTGRES_PASSWORD=ecommerce_dev
      - POSTGRES_DB= product_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce

volumes:
  postgres_data:

networks:
  ecommerce:
    driver: bridge
