name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_dev
          POSTGRES_DB: product_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d product_catalog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/product_catalog_test
      TEST_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/product_catalog_test
      USER_TEST_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/user_service_test
      CART_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/shopping_cart_test
      CART_TEST_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/shopping_cart_test
      ORDER_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/order_service_test
      ORDER_TEST_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/order_service_test
      PAYMENT_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/payment_service_test
      PAYMENT_TEST_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/payment_service_test
      REDIS_URL: redis://localhost:6379/15
      REDIS_TEST_URL: redis://localhost:6379/15
      JWT_SECRET: test-only-jwt-secret-for-ci-at-least-32-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: |
          npx prisma generate --config apps/product-catalog-service/prisma.config.ts
          npx prisma generate --config apps/user-service/prisma.config.ts
          npx prisma generate --config apps/shopping-cart-service/prisma.config.ts
          npx prisma generate --config apps/order-service/prisma.config.ts
          npx prisma generate --config apps/payment-service/prisma.config.ts
        env:
          USER_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/user_service_test

      - name: Create test databases
        run: npm run db:test:create

      - name: Apply test migrations
        run: npm run db:migrate:test

      - name: Build API Gateway
        run: npx nest build api-gateway

      - name: Build Product Catalog Service
        run: npx nest build product-catalog-service

      - name: Build User Service
        run: npx nest build user-service

      - name: Build Shopping Cart Service
        run: npx nest build shopping-cart-service

      - name: Build Order Service
        run: npx nest build order-service

      - name: Build Payment Service
        run: npx nest build payment-service

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Run E2E tests
        run: npm run test:e2e
