name: CI

on:
    push:
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Generate Product Catalog Prisma Client
              run: npx prisma generate --config apps/product-catalog-service/prisma.config.ts
              env:
                  TEST_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/product_catalog_test

            - name: Generate User Service Prisma Client
              run: npx prisma generate --config apps/user-service/prisma.config.ts
              env:
                  USER_DATABASE_URL: postgresql://ecommerce:ecommerce_dev@localhost:5432/user_service

            - name: Build API Gateway
              run: npx nest build api-gateway

            - name: Build Product Catalog Service
              run: npx nest build product-catalog-service

            - name: Build User Service
              run: npx nest build user-service

            - name: Run unit tests
              run: npm test
